{{define "login"}}<section class="panel narrow"><h1>Sign in</h1><p>Enter the local AgentMesh API token. It is never stored in the browser cookie.</p>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}<form method="post" action="/dashboard/login"><label>API token<input type="password" name="token" autocomplete="current-password" required></label><button>Sign in</button></form></section>{{end}}
