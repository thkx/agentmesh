<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>AgentMesh Workflow Editor</title>
        <style>
:root{
    font-family:system-ui,sans-serif;
    color:#172033;
    background:#f5f7fb
}

body{
    margin:0
}

header{
    display:flex;
    gap:8px;
    align-items:center;
    padding:12px;
    background:#fff;
    border-bottom:1px solid #dbe1ea;
    flex-wrap:wrap
}

input,select,button,textarea{
    font:inherit;
    padding:8px;
    border:1px solid #c8d0dc;
    border-radius:6px
}

button{
    cursor:pointer;
    background:#fff
}

button.primary{
    background:#2457d6;
    color:white;
    border-color:#2457d6
}

#status{
    margin-left:auto;
    color:#586174
}

main{
    display:grid;
    grid-template-columns:1fr 320px;
    height:calc(100vh - 62px)
}

#canvas{
    position:relative;
    overflow:auto;
    background-color:#f8fafc;
    background-image:radial-gradient(#d5dce7 1px,transparent 1px);
    background-size:20px 20px
}
    svg{min-width:1200px;min-height:900px;width:100%;height:100%}
    .node rect{fill:white;stroke:#8b9bb2;stroke-width:2;rx:9}
    .node.selected rect{stroke:#2457d6;stroke-width:3}
    .node text{font-size:13px;fill:#172033;pointer-events:none}
    .edge{stroke:#7b8798;stroke-width:2;fill:none;marker-end:url(#arrow)}
    aside{background:#fff;border-left:1px solid #dbe1ea;padding:14px;overflow:auto}
    aside label{display:block;font-size:12px;color:#596579;margin:10px 0 4px}
    aside input,aside textarea,aside select{width:100%;box-sizing:border-box}
    textarea{min-height:180px;font-family:ui-monospace,monospace}
    small{color:#64748b}
    .toolbar{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
    <header>
        <strong>AgentMesh Workflow</strong>
        <input id="token" placeholder="API token (if enabled)" type="password">
        <input id="workflowId" placeholder="Workflow ID">
        <input id="version" placeholder="Version (latest)" style="width:90px">
        <button id="load">Load</button>
        <button id="save" class="primary">Save graph</button>
        <button id="yamlOut">Export YAML</button>
        <button id="yamlIn">Import YAML</button>
        <span id="status">Ready</span>
    </header>
    <main>
        <section id="canvas">
            <svg id="graph" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b8798"/></marker></defs><g id="edges"></g><g id="nodes"></g></svg>
        </section>
        <aside>
            <div class="toolbar">
                <select id="newType">
                    <option value="start">Start</option>
                    <option value="agent">Agent</option>
                    <option value="condition">Condition</option>
                    <option value="approval">Approval</option>
                    <option value="subworkflow">Subworkflow</option>
                    <option value="end">End</option>
                </select>
                <button id="add">Add node</button>
                <button id="connect">Connect selected</button>
                <button id="delete">Delete node</button>
            </div>
            <p>
                <small>
                    Drag nodes to arrange. Select two nodes and choose Connect selected to add an edge. YAML remains the canonical workflow definition.
                </small>
            </p>
            <label>Node ID</label>
            <input id="nodeId">
            <label>Node type</label>
            <input id="nodeType" disabled>
            <label>Node name</label>
            <input id="nodeName">
            <label>Node configuration JSON</label>
            <textarea id="nodeConfig" spellcheck="false"></textarea>
            <button id="apply">Apply node changes</button>
            <hr>
            <label>YAML</label>
            <textarea id="yaml" spellcheck="false" placeholder="YAML import/export appears here"></textarea>
        </aside>
    </main>
    <script src="/workflow-editor/app.js"></script>
</body>
</html>
