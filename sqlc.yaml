version: "2"
sql:
  - engine: "sqlite"
    schema:
      - "internal/platform/database/migrations/000001_init.up.sql"
      - "internal/platform/database/migrations/000002_create_users.up.sql"
      - "internal/platform/database/migrations/000003_create_providers.up.sql"
      - "internal/platform/database/migrations/000004_create_models.up.sql"
      - "internal/platform/database/migrations/000005_create_provider_credentials.up.sql"
      - "internal/platform/database/migrations/000006_create_agent_task_states.up.sql"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
