      - "internal/platform/database/migrations/000008_create_workflows.up.sql"
      - "internal/platform/database/migrations/000009_create_workflow_execution.up.sql"
      - "internal/platform/database/migrations/000010_create_workflow_events.up.sql"
      - "internal/platform/database/migrations/000011_workflow_fencing.up.sql"
      - "internal/platform/database/migrations/000012_create_goal_planning.up.sql"
      - "internal/platform/database/migrations/000013_create_plan_executions.up.sql"
