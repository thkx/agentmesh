
app:
  name: agentmesh
  environment: development

server:
  host: 127.0.0.1
  port: 8080
  read_timeout: 15s
  write_timeout: 30s
  shutdown_timeout: 15s

database:
  driver: sqlite
  dsn: ./data/agentmesh.db
  max_open_conns: 4
  max_idle_conns: 4
  conn_max_lifetime: 0s
  busy_timeout: 5s

log:
  level: info
  format: json
