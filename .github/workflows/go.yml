name: Go CI

on:
  push:
    branches: ["main", "p2/**", "p2-a/**", "p3/**", "p4/**", "p5/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: |
          files="$(gofmt -l $(find . -type f -name '*.go' -not -path './.git/*'))"
          if [ -n "$files" ]; then
            echo "Go files require gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Check P3 acceptance scripts
        run: bash -n scripts/test-p3.sh scripts/e2e-p3.sh scripts/verify-p3.sh scripts/verify-p5-part1.sh
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
