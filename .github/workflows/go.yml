name: Go CI

on:
  push:
    branches: ["main", "p2/**", "p2-a/**", "p3/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Normalize formatting in CI workspace
        run: gofmt -w $(find . -name '*.go' -type f)
      - name: Commit gofmt normalization
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/p3/')
        run: |
          if git diff --quiet; then
            echo "All Go files are already gofmt-formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.go'
          git commit -m "style: normalize Go formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
